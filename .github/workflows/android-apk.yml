name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "export_presets.cfg"
      - "project.godot"
      - "scenes/main.tscn"
      - "scripts/main.gd"
      - "scripts/player.gd"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "export_presets.cfg"
      - "project.godot"
      - "scenes/main.tscn"
      - "scripts/main.gd"
      - "scripts/player.gd"
      - "assets/**"
  workflow_dispatch:

jobs:
  export-debug-apk:
    name: Export installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Android export templates and SDK paths
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.config/godot"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-export-templates.tpz
          mkdir -p /tmp/godot-export-templates
          unzip -q /tmp/godot-export-templates.tpz -d /tmp/godot-export-templates
          cp -a /tmp/godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"
          if [ ! -f "$SETTINGS" ]; then
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' > "$SETTINGS"
          fi
          cat >> "$SETTINGS" <<'EOF'
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/adb = "/usr/bin/adb"
          export/android/jarsigner = "/usr/bin/jarsigner"
          export/android/force_system_user = false
          EOF

      - name: Import project and parse scripts
        run: godot --headless --path . --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Blockraft-debug.apk

      - name: Verify APK output
        run: |
          test -s build/Blockraft-debug.apk
          file build/Blockraft-debug.apk
          unzip -t build/Blockraft-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockraft-android-debug-apk
          path: build/Blockraft-debug.apk
          if-no-files-found: error
          retention-days: 14
