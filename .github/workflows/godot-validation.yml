name: Godot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project and parse scripts
        run: godot --headless --path . --editor --quit
      - name: Launch main menu scene headlessly
        run: godot --headless --path . --quit-after 3
      - name: Launch gameplay scene headlessly
        run: godot --headless --path . res://scenes/main.tscn --quit-after 5
      - name: Verify main menu structure, interactions, and responsive layout
        run: godot --headless --path . --script res://tools/test_main_menu_acceptance.gd
      - name: Capture rendered main menu at 1280x720
        continue-on-error: true
        run: timeout 30s xvfb-run -a godot --path . --rendering-method gl_compatibility --script res://tools/capture_main_menu.gd
      - name: Upload rendered menu screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockraft-main-menu-capture
          path: main_menu_capture.png
          if-no-files-found: warn
          retention-days: 7
